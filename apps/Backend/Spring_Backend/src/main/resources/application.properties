server.port=8080
server.address=0.0.0.0
spring.application.name=spring-backend

# Set firebase.enabled=true when Firebase credentials are provided
firebase.enabled=${FIREBASE_ENABLED:true}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.credentials.json=${FIREBASE_CREDENTIALS_JSON:}
python.backend.url=${PYTHON_BACKEND_URL:http://localhost:5000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
harti.collection.cron=0 30 7 * * *
harti.retraining.cron=0 0 2 * * SUN
